<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIMS Lab</title>
  <script>
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var pages = ['index.html', 'research.html', 'professor.html', 'student.html', 'publications.html', 'photo.html', 'materials.html'];
      for (var i = parts.length - 1; i >= 0; i--) {
        var name = parts[i].replace(/\.html$/, '') + '.html';
        if (pages.indexOf(name) !== -1 && i > 0) {
          location.replace('/' + name + location.search + location.hash);
          return;
        }
      }
    })();
  </script>
  <link rel="icon" href="/static/img/logo.png">
  <link rel="stylesheet" href="/static/css/style.css?v=13">
</head>
<body>
  <main style="min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px 16px;text-align:center">
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 삭제된 페이지입니다.</p>
    <a href="/index.html">홈으로 가기</a>
  </main>
</body>
</html>
